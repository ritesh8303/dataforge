<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataForge — Find Jobs in Europe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #080a10;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    html, body {
      background: #000000;
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
    }

    #root {
      max-width: 1240px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* ── Header ── */
    .header {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 1.5rem;
    }
    
    .header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }
    
    .header p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }

    .nav {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      font-size: 0.85rem;
    }
    
    .nav a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }
    
    .nav a:hover {
      color: #6366f1;
      transform: translateX(-2px);
    }


    /* ── Filters Grid (Polished for 7 Columns) ── */
    .filters {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.85rem;
      margin-bottom: 2rem;
      background: rgba(17, 24, 39, 0.35);
      padding: 1.25rem;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    
    @media(max-width: 1024px) {
      .filters {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    @media(max-width: 640px) {
      .filters {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
        padding: 1rem;
      }
    }
    @media(max-width: 440px) {
      .filters {
        grid-template-columns: 1fr;
      }
    }

    input, select {
      background: rgba(30, 41, 59, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      color: #f1f5f9;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      width: 100%;
      outline: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    input::placeholder {
      color: #64748b;
    }
    
    input:focus, select:focus {
      border-color: #6366f1;
      background: rgba(30, 41, 59, 0.65);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    
    select option {
      background: #0b0d19;
      color: #f1f5f9;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 500;
      padding: 0 0.5rem;
    }
    
    #result-count {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
    }
    
    #last-updated {
      font-size: 0.78rem;
      color: #64748b;
    }

    /* ── Job List ── */
    .job-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .job-card {
      background: rgba(17, 24, 39, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      padding: 1.5rem 1.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(15px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .job-card:hover {
      border-color: rgba(99, 102, 241, 0.3);
      background: rgba(17, 24, 39, 0.55);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.4), 0 0 15px -3px rgba(99, 102, 241, 0.15);
    }
    
    .job-info {
      flex: 1;
      min-width: 0;
    }
    
    .job-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }
    
    .job-company {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 0.3rem;
      font-weight: 500;
    }
    
    .job-meta {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    
    .job-meta span:first-child {
      color: #cbd5e1;
      font-weight: 500;
    }

    /* ── Tags (Styling Upgrades) ── */
    .tag {
      border-radius: 8px;
      padding: 0.25rem 0.65rem;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }
    
    .tag.remote { background: rgba(16, 185, 129, 0.12); color: #34d399; border-color: rgba(16, 185, 129, 0.2); }
    .tag.source-ba { background: rgba(59, 130, 246, 0.12); color: #60a5fa; border-color: rgba(59, 130, 246, 0.2); }
    .tag.source-direct { background: rgba(16, 185, 129, 0.12); color: #34d399; border-color: rgba(16, 185, 129, 0.2); }
    .tag.source-hn { background: rgba(249, 115, 22, 0.15); color: #fdba74; border-color: rgba(249, 115, 22, 0.25); }
    .tag.source-bsj { background: rgba(20, 184, 166, 0.15); color: #2dd4bf; border-color: rgba(20, 184, 166, 0.25); }
     .tag.source-indeed { background: rgba(37, 87, 167, 0.15); color: #79abf7; border-color: rgba(37, 87, 167, 0.25); }
    .tag.type { background: rgba(167, 139, 250, 0.12); color: #c084fc; border-color: rgba(167, 139, 250, 0.2); }
    
    .tag:not(.remote):not(.source-ba):not(.source-direct):not(.source-hn):not(.source-bsj):not(.source-indeed):not(.type) {
      background: rgba(30, 41, 59, 0.5);
      color: #cbd5e1;
      border-color: rgba(255, 255, 255, 0.05);
    }

    
    .tag.exp-junior { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; border-color: rgba(99, 102, 241, 0.25); }
    .tag.exp-student { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border-color: rgba(245, 158, 11, 0.25); }
    .tag.exp-intern { background: rgba(236, 72, 153, 0.15); color: #f472b6; border-color: rgba(236, 72, 153, 0.25); }
    .tag.exp-thesis { background: rgba(6, 182, 212, 0.15); color: #22d3ee; border-color: rgba(6, 182, 212, 0.25); }
    .tag.cat-ai { background: rgba(139, 92, 246, 0.15); color: #c084fc; border-color: rgba(139, 92, 246, 0.25); }
    .tag.cat-dataeng { background: rgba(14, 165, 233, 0.15); color: #38bdf8; border-color: rgba(14, 165, 233, 0.25); }
    .tag.cat-devops { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.25); }
    .tag.cat-analytics { background: rgba(34, 197, 94, 0.15); color: #4ade80; border-color: rgba(34, 197, 94, 0.25); }
    .tag.cat-fd { background: rgba(168, 85, 247, 0.15); color: #c084fc; border-color: rgba(168, 85, 247, 0.25); }
    .tag.direct-apply { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border-color: rgba(245, 158, 11, 0.25); }
    .tag.lang-en { background: rgba(59, 130, 246, 0.12); color: #60a5fa; border-color: rgba(59, 130, 246, 0.18); }
    .tag.lang-de { background: rgba(239, 68, 68, 0.12); color: #f87171; border-color: rgba(239, 68, 68, 0.18); }
    .tag.work-remote { background: rgba(16, 185, 129, 0.12); color: #34d399; border-color: rgba(16, 185, 129, 0.18); }
    .tag.work-hybrid { background: rgba(99, 102, 241, 0.12); color: #818cf8; border-color: rgba(99, 102, 241, 0.18); }
    .tag.work-onsite { background: rgba(100, 116, 139, 0.12); color: #94a3b8; border-color: rgba(100, 116, 139, 0.18); }
    .tag[class*="region-"] { background: rgba(99, 102, 241, 0.12); color: #a5b4fc; border-color: rgba(99, 102, 241, 0.2); }
    
    .tag.clickable { cursor: pointer; transition: all 0.2s ease; }
    .tag.clickable:hover { border-color: rgba(99, 102, 241, 0.5); background: rgba(99, 102, 241, 0.2); color: #ffffff; }

    /* ── Action Buttons & Container ── */
    .btn-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.85rem;
      justify-content: center;
      flex-shrink: 0;
      width: 140px; /* Set solid space to prevent congestion */
    }
    
    @media(max-width: 640px) {
      .btn-container {
        width: 100%;
        flex-direction: row !important;
        justify-content: space-between;
        align-items: center !important;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        padding-top: 1rem;
        margin-top: 0.5rem;
      }
    }

    .apply-btn {
      width: 100%;
      text-align: center;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 0.65rem 1.25rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      display: inline-block;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Outfit', sans-serif;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }
    
    .apply-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.45);
      background: linear-gradient(135deg, #818cf8 0%, #5850ec 100%);
    }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 3rem;
      flex-wrap: wrap;
    }
    
    .page-btn {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      color: #94a3b8;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    
    .page-btn.active {
      background: #6366f1;
      border-color: #6366f1;
      color: #ffffff;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.35);
    }
    
    .page-btn:hover:not(.active) {
      border-color: rgba(99, 102, 241, 0.5);
      color: #f1f5f9;
      background: rgba(30, 41, 59, 0.75);
    }

    .job-desc {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-top: 0.75rem;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      border-left: 2px solid rgba(99, 102, 241, 0.3);
      padding-left: 0.75rem;
    }
    
    .loading {
      font-size: 0.95rem;
      text-align: center;
      color: #64748b;
      padding: 4rem 0;
      font-weight: 500;
    }

    .error {
      color: #f87171;
      font-size: 0.88rem;
      padding: 1.15rem 1.5rem;
      background: rgba(127, 29, 29, 0.25);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 16px;
      margin-bottom: 2rem;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.1);
    }

    /* ── Match Score Badge & Analysis Panel ── */
    .match-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      padding: 0.4rem 0.85rem;
      text-align: center;
      width: 100%; /* Spans width of btn-container */
      font-family: 'Outfit', sans-serif;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .match-badge.high {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.25);
    }
    
    .match-badge.med {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.25);
    }
    
    .match-badge.low {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.2);
    }
    
    .match-badge-pct {
      font-size: 1.2rem;
      font-weight: 800;
    }
    
    .match-badge-lbl {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.85;
    }
    
    /* Analysis Collapsible Row */
    .fit-analysis-toggle {
      background: rgba(30, 41, 59, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      border-radius: 8px;
      padding: 0.4rem 0.85rem;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.85rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-family: 'Outfit', sans-serif;
    }
    
    .fit-analysis-toggle:hover {
      border-color: rgba(99, 102, 241, 0.4);
      color: #ffffff;
      background: rgba(99, 102, 241, 0.1);
    }
    
    .fit-analysis-panel {
      margin-top: 1rem;
      padding: 1.25rem;
      background: rgba(30, 41, 59, 0.2);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .analysis-section {
      margin-bottom: 0.85rem;
    }
    
    .analysis-section:last-child {
      margin-bottom: 0;
    }
    
    .analysis-section-title {
      font-size: 0.72rem;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    
    .analysis-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    
    .analysis-tag {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
    }
    
    .analysis-tag.match {
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.15);
    }
    
    .analysis-tag.gap {
      background: rgba(239, 68, 68, 0.08);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.15);
    }
    
    .analysis-text {
      font-size: 0.78rem;
      color: #e2e8f0;
      line-height: 1.5;
      border-left: 2px solid #6366f1;
      padding-left: 0.75rem;
      margin-top: 0.3rem;
    }
  </style>
</head>
<body>
<div id="root">
  <div class="header">
    <h1>DataForge Job Board</h1>
    <p>Search across Arbeitnow + BA Jobsuche + direct company career feeds · Updated daily</p>
  </div>
  <div class="nav">
    <a href="index.html">← Analytics Dashboard</a>
    <a href="agent.html" style="margin-left:auto;color:#c7d2fe">⚡ AI Career Agent →</a>
  </div>



  <div id="error-box" class="error" style="display:none"></div>
  
  <!-- 6-column Filters row -->
  <div class="filters">
    <input id="search"   type="text" placeholder="Title, company, or keyword..." />
    <input id="location" type="text" placeholder="City (e.g. Berlin)" />
    <select id="source">
      <option value="">All sources</option>
      <option value="arbeitnow">Arbeitnow</option>
      <option value="ba_api">BA Jobsuche</option>
      <option value="direct">Direct company feeds</option>
      <option value="indeed">Indeed</option>

      <option value="hacker_news">Hacker News / YC</option>
      <option value="berlin_startups">Berlin Startup Jobs</option>
    </select>
    <select id="work_style">
      <option value="">All work styles</option>
      <option value="remote">Remote only</option>
      <option value="hybrid">Hybrid only</option>
      <option value="onsite">On-site only</option>
    </select>
    <select id="language">
      <option value="">All languages</option>
      <option value="en">English only (No German)</option>
    </select>
    <select id="region">
      <option value="">All countries</option>
    </select>
    <select id="experience_level">
      <option value="">All experience levels</option>
      <option value="Junior / Entry Level">Junior / Entry Level</option>
      <option value="graduate_no_exp">Master Graduates (No Experience)</option>
      <option value="Working Student">Working Student</option>
      <option value="Internship">Internship</option>
      <option value="Master Thesis">Master Thesis</option>
    </select>
  </div>

  <div class="results-header">
    <span id="result-count">Loading...</span>
    <span id="last-updated"></span>
  </div>

  <div class="job-list" id="job-list">
    <div class="loading">Loading jobs...</div>
  </div>
  <div class="pagination" id="pagination"></div>
</div>

<script>
  const JOBS_API_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" || window.location.protocol === "file:"
    ? "http://localhost:8000/jobs"
    : "https://2amv4immb0.execute-api.eu-central-1.amazonaws.com/";
  const PAGE_SIZE = 25;

  let allJobs = [];
  let filtered = [];
  let page = 1;



  const TYPE_LABELS = {
    full_time: "Full-time", part_time: "Part-time",
    internship: "Internship", freelance: "Freelance", temporary: "Temporary"
  };

  let countriesLoaded = false;

  function populateCountryDropdown(jobs) {
    if (countriesLoaded) return;
    const select = document.getElementById("region");
    const currentValue = select.value;

    const countries = [...new Set(jobs.map(j => j.region).filter(Boolean))];
    countries.sort((a, b) => {
      if (a === "Remote") return -1;
      if (b === "Remote") return 1;
      if (a === "Other") return 1;
      if (b === "Other") return -1;
      return a.localeCompare(b);
    });

    select.innerHTML = '<option value="">All countries</option>';
    countries.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c === "Remote" ? "Remote" : c === "Other" ? "Other (On-site/unspecified)" : c;
      select.appendChild(opt);
    });

    if (currentValue && countries.includes(currentValue)) {
      select.value = currentValue;
    }
    if (jobs.length > 0 && countries.length > 1) {
      countriesLoaded = true;
    }
  }

  async function loadJobs() {
    const source      = document.getElementById("source").value;
    const workStyle   = document.getElementById("work_style").value;
    const languageReq = document.getElementById("language").value;
    const region      = document.getElementById("region").value;

    const params = new URLSearchParams({ limit: 1000, sort: 'newest', status: 'active' });
    if (source)      params.set("source",       source);
    if (workStyle)   params.set("work_style",   workStyle);
    if (languageReq) params.set("language_req", languageReq === "en" ? "english_only" : "");
    if (region)      params.set("region",       region);

    try {
      const res = await fetch(`${JOBS_API_URL}?${params}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      allJobs = data.jobs || [];
      document.getElementById("last-updated").textContent =
        `${(data.kpis?.total || allJobs.length).toLocaleString()} total jobs`;
      
      populateCountryDropdown(allJobs);
      
      applyFilters();
    } catch(e) {
      document.getElementById("error-box").style.display = "block";
      document.getElementById("error-box").textContent = `⚠ ${e.message}`;
      document.getElementById("result-count").textContent = "Failed to load";
    }
  }

  function applyFilters() {
    const search    = document.getElementById("search").value.toLowerCase().trim();
    const location  = document.getElementById("location").value.toLowerCase().trim();
    const language  = document.getElementById("language").value;
    const workStyle = document.getElementById("work_style").value;
    const region    = document.getElementById("region").value;
    const expLevel  = document.getElementById("experience_level").value;

    filtered = allJobs.filter(j => {
      if (region) {
        const jobRegion = j.region || "";
        if (jobRegion.toLowerCase() !== region.toLowerCase()) return false;
      }
      const title   = (j.title    || "").toLowerCase();
      const company = (j.company  || "").toLowerCase();
      const loc     = (j.location || "").toLowerCase();
      const tags    = (j.tags     || "").toLowerCase();

      if (search   && !title.includes(search) && !company.includes(search) && !loc.includes(search) && !tags.includes(search)) return false;
      if (location && !loc.includes(location)) return false;
      
      if (language === "en") {
        if (j.language_requirement) {
          if (j.language_requirement !== "english_only") return false;
        } else {
          if (j.is_english !== "True" && j.is_english !== true) return false;
        }
      }
      
      if (workStyle) {
        if (j.work_style) {
          if (j.work_style !== workStyle) return false;
        } else {
          const isRemote = j.is_remote === "True" || j.is_remote === true;
          if (workStyle === "remote" && !isRemote) return false;
          if (workStyle === "onsite" && isRemote) return false;
        }
      }
      
      if (expLevel) {
        if (expLevel === "graduate_no_exp") {
          const isJun = tags.includes("junior / entry level") || title.includes("junior") || title.includes("entry") || title.includes("graduate");
          const isMast = (j.description && (/\b(master|msc|m\.sc\.|degree|university|graduate|studium|hochschule)\b/i.test(j.description))) || /\b(master|msc|m\.sc\.|degree|university|graduate|studium|hochschule)\b/i.test(title);
          let hasNoExp = true;
          if (j.description) {
            const descLower = j.description.toLowerCase();
            const excludePatterns = [
              /\b[3-9]\s*\+?\s*years?\b/,
              /\b[3-9]\s*jahre\b/,
              /mehrjährige\s+berufserfahrung/,
              /several\s+years\s+of\s+experience/
            ];
            if (excludePatterns.some(pat => pat.test(descLower))) {
              hasNoExp = false;
            }
          }
          if (!isJun || !isMast || !hasNoExp) return false;
        } else {
          if (!tags.includes(expLevel.toLowerCase())) return false;
        }
      }
      return true;
    });

    filtered.sort((a, b) => (b.date_added || "").localeCompare(a.date_added || ""));

    page = 1;
    document.getElementById("result-count").textContent =
      `${filtered.length.toLocaleString()} jobs`;
    renderJobs();
  }

  function renderJobs() {
    const start = (page - 1) * PAGE_SIZE;
    const slice = filtered.slice(start, start + PAGE_SIZE);
    const list  = document.getElementById("job-list");

    if (!filtered.length) {
      list.innerHTML = `<div class="loading">No jobs match your filters.</div>`;
      document.getElementById("pagination").innerHTML = "";
      return;
    }

    list.innerHTML = slice.map(j => {
      const isRemote = j.is_remote === "True" || j.is_remote === true;
      const isDirect = j.source === "direct";
      const sourceLabel = j.source === "ba_api" ? "BA Jobsuche"
        : j.source === "hacker_news" ? "Hacker News / YC"
        : j.source === "berlin_startups" ? "Berlin Startup Jobs"
        : j.source === "indeed" ? "Indeed"
        : isDirect ? `🏢 ${j.ats || 'Direct'}`
        : "Arbeitnow";
      const sourceClass = j.source === "ba_api" ? "source-ba"
        : j.source === "hacker_news" ? "source-hn"
        : j.source === "berlin_startups" ? "source-bsj"
        : j.source === "indeed" ? "source-indeed"
        : isDirect ? "source-direct"
        : "";
      const url = j.job_url || j.url || "#";

      let workStyleBadge = "";
      if (j.work_style) {
        if (j.work_style === "remote") workStyleBadge = `<span class="tag work-remote">🌐 Remote</span>`;
        else if (j.work_style === "hybrid") workStyleBadge = `<span class="tag work-hybrid">🏢 Hybrid</span>`;
        else if (j.work_style === "onsite") workStyleBadge = `<span class="tag work-onsite">📍 On-site</span>`;
      } else {
        workStyleBadge = isRemote ? `<span class="tag work-remote">🌐 Remote</span>` : `<span class="tag work-onsite">📍 On-site</span>`;
      }

      let langReqBadge = "";
      if (j.language_requirement) {
        if (j.language_requirement === "english_only") {
          langReqBadge = `<span class="tag lang-en">🇬🇧 English Only</span>`;
        } else {
          langReqBadge = `<span class="tag lang-de">🇩🇪 German Required</span>`;
        }
      } else {
        const isEn = j.is_english === "True" || j.is_english === true;
        langReqBadge = isEn ? `<span class="tag lang-en">🇬🇧 English Only</span>` : `<span class="tag lang-de">🇩🇪 German Required</span>`;
      }

      const directBadge = isDirect ? `<span class="tag direct-apply">⚡ Direct Apply</span>` : "";

      let regionBadge = "";
      if (j.region && j.region !== "Other" && j.region !== "Remote") {
        regionBadge = `<span class="tag region-${j.region.toLowerCase().replace(/[^a-z0-9]+/g, '-')}">📍 ${esc(j.region)}</span>`;
      }

      const typeTags = (j.job_types || "")
        .split(",")
        .map(t => t.trim())
        .filter(Boolean)
        .map(t => `<span class="tag type">${esc(TYPE_LABELS[t] || t)}</span>`)
        .join("");

      const tagChips = (j.tags || '')
        .split(',')
        .map(t => t.trim())
        .filter(t => t && t !== 'nan' && t.length < 40)
        .slice(0, 5)
        .map(t => {
          let extraClass = 'clickable';
          if (t === 'Junior / Entry Level') extraClass += ' exp-junior';
          else if (t === 'Working Student') extraClass += ' exp-student';
          else if (t === 'Internship') extraClass += ' exp-intern';
          else if (t === 'Master Thesis') extraClass += ' exp-thesis';
          else if (t === 'AI / ML') extraClass += ' cat-ai';
          else if (t === 'Data Engineering') extraClass += ' cat-dataeng';
          else if (t === 'Cloud / DevOps') extraClass += ' cat-devops';
          else if (t === 'Analytics / BI') extraClass += ' cat-analytics';
          else if (t === 'Forward Deployed') extraClass += ' cat-fd';
          
          return `<span class="tag ${extraClass}" onclick="filterByTag('${esc(t)}', event)">${esc(t)}</span>`;
        })
        .join('');

      const rawDesc = j.description || '';
      const plainDesc = rawDesc.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      const showDesc = (j.source === 'arbeitnow' || j.source === 'direct') && plainDesc.length > 10;
      const descSnippet = showDesc
        ? `<div class="job-desc">${esc(plainDesc.slice(0, 180))}${plainDesc.length > 180 ? '…' : ''}</div>`
        : '';

      return `
        <div class="job-card" id="job-card-${j.job_id}">
          <div class="job-info">
            <div class="job-title" title="${esc(j.title)}">${esc(j.title)}</div>
            <div class="job-company">${esc(j.company || '\u2014')}</div>
            <div class="job-meta">
              <span>📍 ${esc((j.location || '\u2014').split(',')[0].trim())}</span>
              <span class="tag ${sourceClass}">${sourceLabel}</span>
              ${directBadge}
              ${regionBadge}
              ${workStyleBadge}
              ${langReqBadge}
              ${typeTags}
              ${tagChips}
              <span>${j.date_added || ''}</span>
            </div>
            ${descSnippet}
          </div>
          <div class="btn-container">
            <a class="apply-btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">
              Apply →
            </a>
          </div>
        </div>`;
    }).join("");

    renderPagination();
  }

  function renderPagination() {
    const total = Math.ceil(filtered.length / PAGE_SIZE);
    if (total <= 1) { document.getElementById("pagination").innerHTML = ""; return; }
    const lo = Math.max(1, page - 2), hi = Math.min(total, page + 2);
    const btns = [];
    if (page > 1) btns.push(`<button class="page-btn" onclick="goPage(${page-1})">‹</button>`);
    for (let i = lo; i <= hi; i++)
      btns.push(`<button class="page-btn ${i===page?"active":""}" onclick="goPage(${i})">${i}</button>`);
    if (page < total) btns.push(`<button class="page-btn" onclick="goPage(${page+1})">›</button>`);
    document.getElementById("pagination").innerHTML = btns.join("");
  }

  function goPage(p) { page = p; renderJobs(); window.scrollTo(0, 0); }

  function esc(s) {
    return String(s || "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  ["search","location"].forEach(id => {
    document.getElementById(id).addEventListener("input", applyFilters);
  });
  ["source","work_style","language","region"].forEach(id => {
    document.getElementById(id).addEventListener("change", loadJobs);
  });
  ["experience_level"].forEach(id => {
    document.getElementById(id).addEventListener("change", applyFilters);
  });

  loadJobs();
</script>
</body>
</html>
