<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataForge — Find Jobs in Europe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: radial-gradient(circle at 50% 0%, #111424 0%, #060813 100%);
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }

    #root { max-width: 1140px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }

    /* ── Header ── */
    .header {
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 1.5rem;
    }
    .header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem; font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }
    .header p { color: #94a3b8; font-size: 0.9rem; margin-top: 0.4rem; }

    .nav { display: flex; gap: 1rem; margin-bottom: 2rem; font-size: 0.85rem; }
    .nav a {
      color: #818cf8; text-decoration: none; font-weight: 600;
      transition: color 0.15s ease;
      display: flex; align-items: center; gap: 0.25rem;
    }
    .nav a:hover { color: #6366f1; text-decoration: none; }

    /* ── Filters ── */
    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem; margin-bottom: 1.75rem;
      background: rgba(17, 24, 39, 0.35);
      padding: 1rem; border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    @media(min-width:768px){ .filters { grid-template-columns: 2fr 1.25fr 1fr 1fr 1fr 1fr 1fr 1.25fr; } }

    input, select {
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: #f1f5f9;
      padding: 0.7rem 0.95rem;
      font-size: 0.85rem;
      width: 100%;
      outline: none;
      transition: all 0.2s ease;
    }
    input::placeholder { color: #64748b; }
    input:focus, select:focus {
      border-color: #6366f1;
      background: rgba(30, 41, 59, 0.7);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    select option { background: #0f111a; color: #f1f5f9; }

    .results-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.25rem; font-size: 0.85rem; color: #94a3b8;
      font-weight: 500;
    }
    #result-count { font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 700; color: #fff; }

    /* ── Job List ── */
    .job-list { display: flex; flex-direction: column; gap: 0.85rem; }
    
    .job-card {
      background: rgba(17, 24, 39, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 1.3rem 1.6rem;
      display: flex; justify-content: space-between; align-items: center;
      gap: 1.5rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(12px);
    }
    
    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .job-card:hover {
      border-color: rgba(99, 102, 241, 0.35);
      background: rgba(17, 24, 39, 0.65);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px -10px rgba(0, 0, 0, 0.5), 0 0 10px -2px rgba(99, 102, 241, 0.1);
    }
    
    .job-info { flex: 1; min-width: 0; }
    .job-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem; font-weight: 600; color: #f8fafc;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .job-company { font-size: 0.88rem; color: #94a3b8; margin-top: 0.25rem; font-weight: 500; }
    
    .job-meta {
      font-size: 0.78rem; color: #64748b; margin-top: 0.6rem;
      display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;
    }
    .job-meta span:first-child { color: #cbd5e1; font-weight: 500; }

    /* ── Tags ── */
    .tag {
      border-radius: 6px; padding: 0.2rem 0.6rem; font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.01em; border: 1px solid rgba(255, 255, 255, 0.02);
    }
    .tag.remote { background: rgba(16, 185, 129, 0.12); color: #34d399; border-color: rgba(16, 185, 129, 0.15); }
    .tag.source-ba { background: rgba(59, 130, 246, 0.12); color: #60a5fa; border-color: rgba(59, 130, 246, 0.15); }
    .tag.source-direct { background: rgba(16, 185, 129, 0.12); color: #34d399; border-color: rgba(16, 185, 129, 0.15); }
    .tag.source-hn { background: rgba(249, 115, 22, 0.15); color: #fdba74; border-color: rgba(249, 115, 22, 0.25); }
    .tag.source-bsj { background: rgba(20, 184, 166, 0.15); color: #2dd4bf; border-color: rgba(20, 184, 166, 0.25); }
    .tag.type { background: rgba(167, 139, 250, 0.12); color: #c084fc; border-color: rgba(167, 139, 250, 0.15); }
    
    .tag:not(.remote):not(.source-ba):not(.source-direct):not(.source-hn):not(.source-bsj):not(.type) {
      background: rgba(30, 41, 59, 0.6); color: #94a3b8;
    }
    .tag.exp-junior { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; border-color: rgba(99, 102, 241, 0.25); }
    .tag.exp-student { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border-color: rgba(245, 158, 11, 0.25); }
    .tag.exp-intern { background: rgba(236, 72, 153, 0.15); color: #f472b6; border-color: rgba(236, 72, 153, 0.25); }
    .tag.exp-thesis { background: rgba(6, 182, 212, 0.15); color: #22d3ee; border-color: rgba(6, 182, 212, 0.25); }
    .tag.cat-ai { background: rgba(139, 92, 246, 0.15); color: #c084fc; border-color: rgba(139, 92, 246, 0.25); }
    .tag.cat-dataeng { background: rgba(14, 165, 233, 0.15); color: #38bdf8; border-color: rgba(14, 165, 233, 0.25); }
    .tag.cat-devops { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.25); }
    .tag.cat-analytics { background: rgba(34, 197, 94, 0.15); color: #4ade80; border-color: rgba(34, 197, 94, 0.25); }
    .tag.cat-fd { background: rgba(168, 85, 247, 0.15); color: #c084fc; border-color: rgba(168, 85, 247, 0.25); }
    .tag.direct-apply { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border-color: rgba(245, 158, 11, 0.25); }
    .tag.lang-en { background: rgba(59, 130, 246, 0.12); color: #60a5fa; border-color: rgba(59, 130, 246, 0.18); }
    .tag.lang-de { background: rgba(239, 68, 68, 0.12); color: #f87171; border-color: rgba(239, 68, 68, 0.18); }
    .tag.work-remote { background: rgba(16, 185, 129, 0.12); color: #34d399; border-color: rgba(16, 185, 129, 0.18); }
    .tag.work-hybrid { background: rgba(99, 102, 241, 0.12); color: #818cf8; border-color: rgba(99, 102, 241, 0.18); }
    .tag.work-onsite { background: rgba(100, 116, 139, 0.12); color: #94a3b8; border-color: rgba(100, 116, 139, 0.18); }
    
    .tag.clickable { cursor: pointer; transition: all 0.15s ease; }
    .tag.clickable:hover { border-color: rgba(99, 102, 241, 0.5); background: rgba(99, 102, 241, 0.2); color: #fff; }

    /* ── Buttons ── */
    .apply-btn {
      flex-shrink: 0;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #fff; border: none; border-radius: 10px;
      padding: 0.6rem 1.25rem; font-size: 0.82rem; font-weight: 600;
      cursor: pointer; text-decoration: none; white-space: nowrap;
      display: inline-block; transition: all 0.2s ease;
      font-family: 'Outfit', sans-serif;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }
    .apply-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
      background: linear-gradient(135deg, #818cf8 0%, #5850ec 100%);
    }

    /* ── Pagination ── */
    .pagination { display: flex; justify-content: center; gap: 0.5rem; margin-top: 2rem; flex-wrap: wrap; }
    .page-btn {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px; color: #94a3b8;
      padding: 0.45rem 0.85rem; font-size: 0.82rem; cursor: pointer;
      transition: all 0.2s ease;
    }
    .page-btn.active {
      background: #6366f1; border-color: #6366f1; color: #fff;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
    }
    .page-btn:hover:not(.active) {
      border-color: rgba(99, 102, 241, 0.5);
      color: #f1f5f9;
      background: rgba(30, 41, 59, 0.7);
    }

    .job-desc {
      font-size: 0.78rem; color: #94a3b8; margin-top: 0.6rem; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      border-left: 2px solid rgba(99, 102, 241, 0.2);
      padding-left: 0.6rem;
    }
    .loading { font-size: 0.9rem; text-align: center; color: #64748b; padding: 3rem 0; font-weight: 500; }

    .error {
      color: #f87171; font-size: 0.88rem; padding: 1rem 1.25rem;
      background: rgba(127, 29, 29, 0.25); border: 1px solid rgba(239, 68, 68, 0.45);
      border-radius: 12px; margin-bottom: 2rem;
      backdrop-filter: blur(8px);
    }

    /* ── Resume Matcher Styles ── */
    .matcher-panel {
      background: rgba(17, 24, 39, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .matcher-header {
      padding: 1.15rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      background: rgba(30, 41, 59, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
      user-select: none;
    }
    .matcher-header:hover {
      background: rgba(30, 41, 59, 0.3);
    }
    .matcher-header h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #fff 40%, #c7d2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .toggle-icon {
      color: #94a3b8;
      font-size: 0.8rem;
      transition: transform 0.3s ease;
    }
    .matcher-body {
      padding: 1.5rem;
      transition: max-height 0.3s ease-in-out, padding 0.3s ease-in-out;
      max-height: 800px;
    }
    .matcher-body.collapsed {
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      overflow: hidden;
    }
    .matcher-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
    }
    @media(max-width: 768px) {
      .matcher-grid {
        grid-template-columns: 1fr;
      }
    }
    .matcher-input-col, .matcher-config-col {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .matcher-input-col label, .input-group label {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #resume-text {
      width: 100%;
      height: 120px;
      background: rgba(30, 41, 59, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      color: #f1f5f9;
      padding: 0.75rem;
      font-size: 0.85rem;
      font-family: inherit;
      resize: vertical;
      outline: none;
      transition: all 0.2s ease;
    }
    #resume-text:focus {
      border-color: #6366f1;
      background: rgba(30, 41, 59, 0.50);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    .match-btn {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.8rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      margin-top: auto;
    }
    .match-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
      background: linear-gradient(135deg, #818cf8 0%, #5850ec 100%);
    }
    .clear-btn {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 10px;
      padding: 0.6rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .clear-btn:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }
    .detected-skills-box {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .detected-skills-title {
      font-size: 0.78rem;
      color: #94a3b8;
      font-weight: 600;
      margin-bottom: 0.65rem;
    }
    .detected-skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .skill-tag {
      background: rgba(99, 102, 241, 0.12);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 6px;
      padding: 0.18rem 0.55rem;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: default;
    }
    
    /* ── Match Score Badge & Analysis Panel ── */
    .match-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      padding: 0.5rem 0.85rem;
      text-align: center;
      min-width: 85px;
      font-family: 'Outfit', sans-serif;
    }
    .match-badge.high {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .match-badge.med {
      background: rgba(245, 158, 11, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.25);
    }
    .match-badge.low {
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .match-badge-pct {
      font-size: 1.15rem;
      font-weight: 800;
    }
    .match-badge-lbl {
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.85;
    }
    
    /* Analysis Collapsible Row */
    .fit-analysis-toggle {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #94a3b8;
      border-radius: 8px;
      padding: 0.35rem 0.75rem;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.75rem;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .fit-analysis-toggle:hover {
      border-color: rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.05);
    }
    .fit-analysis-panel {
      margin-top: 1rem;
      padding: 1rem;
      background: rgba(30, 41, 59, 0.2);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .analysis-section {
      margin-bottom: 0.85rem;
    }
    .analysis-section:last-child {
      margin-bottom: 0;
    }
    .analysis-section-title {
      font-size: 0.7rem;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }
    .analysis-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .analysis-tag {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 5px;
    }
    .analysis-tag.match {
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.15);
    }
    .analysis-tag.gap {
      background: rgba(239, 68, 68, 0.08);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.15);
    }
    .analysis-text {
      font-size: 0.75rem;
      color: #cbd5e1;
      line-height: 1.4;
      border-left: 2px solid #6366f1;
      padding-left: 0.6rem;
      margin-top: 0.25rem;
    }

    @media(max-width: 640px) {
      .job-card {
        flex-direction: column;
        align-items: stretch;
        gap: 1rem;
      }
      .job-card > div:last-child {
        flex-direction: row !important;
        justify-content: space-between;
        align-items: center !important;
        border-top: 1px solid rgba(255, 255, 255, 0.04);
        padding-top: 0.75rem;
      }
    }
  </style>
</head>
<body>
<div id="root">
  <div class="header">
    <h1>🔍 Find Jobs in Europe</h1>
    <p>Search across Arbeitnow + BA Jobsuche + direct company career feeds · Updated up to 14× daily</p>
  </div>
  <div class="nav">
    <a href="index.html">← Analytics Dashboard</a>
  </div>

  <!-- Resume Matcher Panel -->
  <div class="matcher-panel" id="matcher-panel">
    <div class="matcher-header" onclick="toggleMatcher()">
      <h3>⚡ AI Resume Matcher & Skill Gap Analyzer</h3>
      <span class="toggle-icon" id="matcher-toggle-icon">▲</span>
    </div>
    <div class="matcher-body" id="matcher-body">
      <div class="matcher-grid">
        <div class="matcher-input-col">
          <label for="resume-text">Paste Resume Text</label>
          <textarea id="resume-text" placeholder="Paste your resume, skills profile, or experience history here..."></textarea>
        </div>
        <div class="matcher-config-col">
          <div class="input-group">
            <label for="user-seniority">Target Seniority Level</label>
            <select id="user-seniority">
              <option value="mid">Mid-level (2-5 yrs)</option>
              <option value="junior">Junior / Entry level (0-2 yrs)</option>
              <option value="senior">Senior (5+ yrs)</option>
              <option value="lead">Lead / Principal (8+ yrs)</option>
            </select>
          </div>
          <button class="match-btn" id="match-btn" onclick="runMatching()">⚡ Scan & Match Jobs</button>
          <button class="clear-btn" id="clear-btn" onclick="clearMatching()" style="display:none">Clear Match</button>
        </div>
      </div>
      
      <div class="detected-skills-box" id="detected-skills-box" style="display:none">
        <div class="detected-skills-title">We detected these skills on your resume:</div>
        <div class="detected-skills-list" id="detected-skills-list"></div>
      </div>
    </div>
  </div>

  <div id="error-box" class="error" style="display:none"></div>
  <div class="filters">
    <input id="search"   type="text" placeholder="Title, company, or keyword..." />
    <input id="location" type="text" placeholder="City (e.g. Berlin)" />
    <select id="job_type">
      <option value="">All types</option>
      <option value="full_time">Full-time</option>
      <option value="part_time">Part-time</option>
      <option value="internship">Internship</option>
      <option value="freelance">Freelance</option>
      <option value="temporary">Temporary</option>
    </select>
    <select id="source">
      <option value="">All sources</option>
      <option value="arbeitnow">Arbeitnow</option>
      <option value="ba_api">BA Jobsuche</option>
      <option value="direct">Direct company feeds</option>
      <option value="hacker_news">Hacker News / YC</option>
      <option value="berlin_startups">Berlin Startup Jobs</option>
    </select>
    <select id="work_style">
      <option value="">All work styles</option>
      <option value="remote">Remote only</option>
      <option value="hybrid">Hybrid only</option>
      <option value="onsite">On-site only</option>
    </select>
    <select id="language">
      <option value="">All languages</option>
      <option value="en">English only (No German)</option>
    </select>
    <select id="experience_level">
      <option value="">All experience levels</option>
      <option value="Junior / Entry Level">Junior / Entry Level</option>
      <option value="Working Student">Working Student</option>
      <option value="Internship">Internship</option>
      <option value="Master Thesis">Master Thesis</option>
    </select>
    <select id="sort_order">
      <option id="sort-match-option" value="match_desc" style="display:none">Sort: Best Match Score</option>
      <option value="newest">Sort: Newest first</option>
      <option value="oldest">Sort: Oldest first</option>
      <option value="title_asc">Sort: A-Z (Title)</option>
      <option value="company_asc">Sort: A-Z (Company)</option>
    </select>
  </div>

  <div class="results-header">
    <span id="result-count">Loading...</span>
    <span id="last-updated"></span>
  </div>

  <div class="job-list" id="job-list">
    <div class="loading">Loading jobs...</div>
  </div>
  <div class="pagination" id="pagination"></div>
</div>

<script>
  // Swap for local testing:
  // const JOBS_API_URL = "http://localhost:8000/";
  const JOBS_API_URL = "https://2amv4immb0.execute-api.eu-central-1.amazonaws.com/";
  const PAGE_SIZE = 25;

  let allJobs = [];
  let filtered = [];
  let page = 1;

  // Matching engine state
  let userSkills = [];
  let userSeniority = "mid";
  let hasResumeMatched = false;
  const activeAnalysisIds = new Set();

  const TYPE_LABELS = {
    full_time: "Full-time", part_time: "Part-time",
    internship: "Internship", freelance: "Freelance", temporary: "Temporary"
  };

  const CANONICAL_SKILL_MAP = {
    "python": "Python",
    "sql": "SQL",
    "java": "Java",
    "scala": "Scala",
    "go": "Go",
    "golang": "Go",
    "typescript": "TypeScript",
    "javascript": "JavaScript",
    "c++": "C++",
    "rust": "Rust",
    "spark": "Spark",
    "pyspark": "Spark",
    "kafka": "Kafka",
    "airflow": "Airflow",
    "dbt": "dbt",
    "pandas": "Pandas",
    "numpy": "NumPy",
    "hadoop": "Hadoop",
    "hive": "Hive",
    "flink": "Flink",
    "databricks": "Databricks",
    "snowflake": "Snowflake",
    "bigquery": "BigQuery",
    "redshift": "Redshift",
    "etl": "ETL",
    "elt": "ELT",
    "aws": "AWS",
    "amazon web services": "AWS",
    "azure": "Azure",
    "gcp": "GCP",
    "google cloud": "GCP",
    "kubernetes": "Kubernetes",
    "docker": "Docker",
    "terraform": "Terraform",
    "devops": "DevOps",
    "postgres": "PostgreSQL",
    "postgresql": "PostgreSQL",
    "mysql": "MySQL",
    "mongodb": "MongoDB",
    "redis": "Redis",
    "elasticsearch": "Elasticsearch",
    "duckdb": "DuckDB",
    "machine learning": "Machine Learning",
    "deep learning": "Deep Learning",
    "llm": "LLM",
    "nlp": "NLP",
    "pytorch": "PyTorch",
    "tensorflow": "TensorFlow",
    "scikit-learn": "Scikit-Learn",
    "scikit": "Scikit-Learn",
    "mlflow": "MLflow",
    "hugging face": "Hugging Face",
    "openai": "OpenAI",
    "generative ai": "Generative AI",
    "genai": "Generative AI",
    "rag": "RAG",
    "langchain": "LangChain",
    "artificial intelligence": "AI / ML",
    "power bi": "Power BI",
    "tableau": "Tableau",
    "looker": "Looker",
    "excel": "Excel",
    "grafana": "Grafana",
    "analytics": "Analytics",
    "business intelligence": "BI"
  };

  function extractSkills(text) {
    if (!text) return [];
    const textLower = text.toLowerCase();
    const skills = new Set();
    for (const [kw, canonical] of Object.entries(CANONICAL_SKILL_MAP)) {
      const hasBoundaries = /^[a-z0-9]+$/i.test(kw);
      let isMatched = false;
      if (hasBoundaries) {
        const escapedKw = kw.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        isMatched = new RegExp(`\\b${escapedKw}\\b`, 'i').test(textLower);
      } else {
        isMatched = textLower.includes(kw);
      }
      if (isMatched) {
        skills.add(canonical);
      }
    }
    return Array.from(skills);
  }

  function detectSeniority(titleText) {
    const text = titleText.toLowerCase();
    if (text.includes("lead") || text.includes("principal") || text.includes("director") || text.includes("head") || text.includes("manager")) {
      return "lead";
    }
    if (text.includes("senior") || text.includes("sr") || text.includes("experienced")) {
      return "senior";
    }
    if (text.includes("junior") || text.includes("jr") || text.includes("entry") || text.includes("intern") || text.includes("student") || text.includes("werkstudent") || text.includes("praktikum")) {
      return "junior";
    }
    return "mid";
  }

  function calculateJobMatch(j) {
    // 1. Skill Match (60%)
    const jobText = `${j.title || ''} ${j.tags || ''} ${j.description || ''}`;
    const jobSkills = extractSkills(jobText);
    
    let skillScore = 0;
    let matchedSkills = [];
    let missingSkills = [];
    
    if (jobSkills.length > 0) {
      matchedSkills = jobSkills.filter(s => userSkills.includes(s));
      missingSkills = jobSkills.filter(s => !userSkills.includes(s));
      skillScore = (matchedSkills.length / jobSkills.length) * 100;
    }
    
    // 2. Seniority Match (20%)
    const jobSeniority = detectSeniority(j.title || '');
    let seniorityScore = 100;
    if (userSeniority !== jobSeniority) {
      const levels = ["junior", "mid", "senior", "lead"];
      const userIdx = levels.indexOf(userSeniority);
      const jobIdx = levels.indexOf(jobSeniority);
      const diff = Math.abs(userIdx - jobIdx);
      if (diff === 1) seniorityScore = 60;
      else if (diff >= 2) seniorityScore = 20;
    }
    
    // 3. Domain Match (20%)
    const title = (j.title || '').toLowerCase();
    let domainScore = 0;
    const titleKeywords = ["engineer", "scientist", "analyst", "developer", "architect", "consultant"];
    const matchedDomainWords = titleKeywords.filter(w => title.includes(w));
    
    if (matchedDomainWords.length === 0) {
      domainScore = 100;
    } else {
      const resumeLower = (document.getElementById("resume-text").value || "").toLowerCase();
      const hasWordInResume = matchedDomainWords.some(w => resumeLower.includes(w));
      if (hasWordInResume) {
        domainScore = 100;
      } else {
        domainScore = 40;
      }
    }
    
    const totalScore = Math.round((skillScore * 0.60) + (seniorityScore * 0.20) + (domainScore * 0.20));
    return {
      score: totalScore,
      matchedSkills: matchedSkills,
      missingSkills: missingSkills,
      jobSkills: jobSkills
    };
  }

  window.toggleMatcher = function() {
    const body = document.getElementById("matcher-body");
    const icon = document.getElementById("matcher-toggle-icon");
    if (body.classList.contains("collapsed")) {
      body.classList.remove("collapsed");
      icon.style.transform = "rotate(0deg)";
    } else {
      body.classList.add("collapsed");
      icon.style.transform = "rotate(180deg)";
    }
  };

  window.runMatching = function() {
    const resumeText = document.getElementById("resume-text").value.trim();
    if (!resumeText) {
      alert("Please paste some resume text or list of skills first!");
      return;
    }
    
    userSkills = extractSkills(resumeText);
    userSeniority = document.getElementById("user-seniority").value;
    hasResumeMatched = true;
    
    const skillsListEl = document.getElementById("detected-skills-list");
    const skillsBoxEl = document.getElementById("detected-skills-box");
    
    if (userSkills.length > 0) {
      skillsListEl.innerHTML = userSkills.map(s => `<span class="skill-tag">${s}</span>`).join("");
      skillsBoxEl.style.display = "block";
    } else {
      skillsListEl.innerHTML = `<span style="color:#94a3b8;font-size:0.8rem">No common technical skills detected. Try adding some keywords (e.g. Python, SQL, AWS) to your text.</span>`;
      skillsBoxEl.style.display = "block";
    }
    
    // Calculate match details for all jobs
    allJobs.forEach(j => {
      j.matchDetails = calculateJobMatch(j);
    });
    
    // Show match sort option and select it
    const matchOpt = document.getElementById("sort-match-option");
    if (matchOpt) {
      matchOpt.style.display = "block";
    }
    document.getElementById("sort_order").value = "match_desc";
    document.getElementById("clear-btn").style.display = "inline-block";
    
    applyFilters();
  };

  window.clearMatching = function() {
    document.getElementById("resume-text").value = "";
    document.getElementById("detected-skills-box").style.display = "none";
    document.getElementById("clear-btn").style.display = "none";
    
    const matchOpt = document.getElementById("sort-match-option");
    if (matchOpt) {
      matchOpt.style.display = "none";
    }
    
    hasResumeMatched = false;
    allJobs.forEach(j => {
      delete j.matchDetails;
    });
    
    document.getElementById("sort_order").value = "newest";
    applyFilters();
  };

  window.filterByTag = function(tagName, event) {
    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }
    document.getElementById("search").value = tagName;
    applyFilters();
    document.querySelector(".results-header").scrollIntoView({ behavior: 'smooth' });
  };

  window.toggleAnalysis = function(jobId, event) {
    event.preventDefault();
    event.stopPropagation();
    const panel = document.getElementById(`analysis-${jobId}`);
    const btn = event.currentTarget;
    if (activeAnalysisIds.has(jobId)) {
      activeAnalysisIds.delete(jobId);
      if (panel) panel.style.display = "none";
      btn.innerText = "View Fit Analysis ▼";
    } else {
      activeAnalysisIds.add(jobId);
      if (panel) panel.style.display = "block";
      btn.innerText = "Hide Fit Analysis ▲";
    }
  };

  async function loadJobs() {
    const source      = document.getElementById("source").value;
    const workStyle   = document.getElementById("work_style").value;
    const languageReq = document.getElementById("language").value;
    const job_type    = document.getElementById("job_type").value;

    const params = new URLSearchParams({ limit: 1000, sort: 'newest', status: 'active' });
    if (source)      params.set("source",       source);
    if (workStyle)   params.set("work_style",   workStyle);
    if (languageReq) params.set("language_req", languageReq === "en" ? "english_only" : "");
    if (job_type)    params.set("job_type",     job_type);

    try {
      const res = await fetch(`${JOBS_API_URL}?${params}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      allJobs = data.jobs || [];
      document.getElementById("last-updated").textContent =
        `${(data.kpis?.total || allJobs.length).toLocaleString()} total jobs`;
      
      // Re-run matching on load if user had matching active
      if (hasResumeMatched) {
        allJobs.forEach(j => {
          j.matchDetails = calculateJobMatch(j);
        });
      }
      
      applyFilters();
    } catch(e) {
      document.getElementById("error-box").style.display = "block";
      document.getElementById("error-box").textContent = `⚠ ${e.message}`;
      document.getElementById("result-count").textContent = "Failed to load";
    }
  }

  function applyFilters() {
    const search    = document.getElementById("search").value.toLowerCase().trim();
    const location  = document.getElementById("location").value.toLowerCase().trim();
    const language  = document.getElementById("language").value;
    const workStyle = document.getElementById("work_style").value;
    const expLevel  = document.getElementById("experience_level").value;

    filtered = allJobs.filter(j => {
      const title   = (j.title    || "").toLowerCase();
      const company = (j.company  || "").toLowerCase();
      const loc     = (j.location || "").toLowerCase();
      const tags    = (j.tags     || "").toLowerCase();

      if (search   && !title.includes(search) && !company.includes(search) && !loc.includes(search) && !tags.includes(search)) return false;
      if (location && !loc.includes(location)) return false;
      
      // Filter by language
      if (language === "en") {
        if (j.language_requirement) {
          if (j.language_requirement !== "english_only") return false;
        } else {
          if (j.is_english !== "True" && j.is_english !== true) return false;
        }
      }
      
      // Filter by work style
      if (workStyle) {
        if (j.work_style) {
          if (j.work_style !== workStyle) return false;
        } else {
          const isRemote = j.is_remote === "True" || j.is_remote === true;
          if (workStyle === "remote" && !isRemote) return false;
          if (workStyle === "onsite" && isRemote) return false;
        }
      }
      
      if (expLevel && !tags.includes(expLevel.toLowerCase())) return false;
      return true;
    });

    // Apply client-side sorting based on select choice
    const sortVal = document.getElementById("sort_order").value;
    if (sortVal === "match_desc" && hasResumeMatched) {
      filtered.sort((a, b) => {
        const scoreA = a.matchDetails ? a.matchDetails.score : 0;
        const scoreB = b.matchDetails ? b.matchDetails.score : 0;
        if (scoreB !== scoreA) return scoreB - scoreA;
        return (b.date_added || "").localeCompare(a.date_added || "");
      });
    } else if (sortVal === "newest") {
      filtered.sort((a, b) => (b.date_added || "").localeCompare(a.date_added || ""));
    } else if (sortVal === "oldest") {
      filtered.sort((a, b) => (a.date_added || "").localeCompare(b.date_added || ""));
    } else if (sortVal === "title_asc") {
      filtered.sort((a, b) => (a.title || "").localeCompare(b.title || ""));
    } else if (sortVal === "company_asc") {
      filtered.sort((a, b) => (a.company || "").localeCompare(b.company || ""));
    }

    page = 1;
    document.getElementById("result-count").textContent =
      `${filtered.length.toLocaleString()} jobs`;
    renderJobs();
  }

  function renderJobs() {
    const start = (page - 1) * PAGE_SIZE;
    const slice = filtered.slice(start, start + PAGE_SIZE);
    const list  = document.getElementById("job-list");

    if (!filtered.length) {
      list.innerHTML = `<div class="loading">No jobs match your filters.</div>`;
      document.getElementById("pagination").innerHTML = "";
      return;
    }

    list.innerHTML = slice.map(j => {
      const isRemote = j.is_remote === "True" || j.is_remote === true;
      const isDirect = j.source === "direct";
      const sourceLabel = j.source === "ba_api" ? "BA Jobsuche"
        : j.source === "hacker_news" ? "Hacker News / YC"
        : j.source === "berlin_startups" ? "Berlin Startup Jobs"
        : isDirect ? `🏢 ${j.ats || 'Direct'}`
        : "Arbeitnow";
      const sourceClass = j.source === "ba_api" ? "source-ba"
        : j.source === "hacker_news" ? "source-hn"
        : j.source === "berlin_startups" ? "source-bsj"
        : isDirect ? "source-direct"
        : "";
      const url = j.job_url || j.url || "#";

      let workStyleBadge = "";
      if (j.work_style) {
        if (j.work_style === "remote") workStyleBadge = `<span class="tag work-remote">🌐 Remote</span>`;
        else if (j.work_style === "hybrid") workStyleBadge = `<span class="tag work-hybrid">🏢 Hybrid</span>`;
        else if (j.work_style === "onsite") workStyleBadge = `<span class="tag work-onsite">📍 On-site</span>`;
      } else {
        workStyleBadge = isRemote ? `<span class="tag work-remote">🌐 Remote</span>` : `<span class="tag work-onsite">📍 On-site</span>`;
      }

      let langReqBadge = "";
      if (j.language_requirement) {
        if (j.language_requirement === "english_only") {
          langReqBadge = `<span class="tag lang-en">🇬🇧 English Only</span>`;
        } else {
          langReqBadge = `<span class="tag lang-de">🇩🇪 German Required</span>`;
        }
      } else {
        const isEn = j.is_english === "True" || j.is_english === true;
        langReqBadge = isEn ? `<span class="tag lang-en">🇬🇧 English Only</span>` : `<span class="tag lang-de">🇩🇪 German Required</span>`;
      }

      const directBadge = isDirect ? `<span class="tag direct-apply">⚡ Direct Apply</span>` : "";

      // Parse job_types CSV string into individual tags
      const typeTags = (j.job_types || "")
        .split(",")
        .map(t => t.trim())
        .filter(Boolean)
        .map(t => `<span class="tag type">${esc(TYPE_LABELS[t] || t)}</span>`)
        .join("");

      // Tags chips (Arbeitnow real category tags)
      const tagChips = (j.tags || '')
        .split(',')
        .map(t => t.trim())
        .filter(t => t && t !== 'nan' && t.length < 40)
        .slice(0, 5)
        .map(t => {
          let extraClass = 'clickable';
          if (t === 'Junior / Entry Level') extraClass += ' exp-junior';
          else if (t === 'Working Student') extraClass += ' exp-student';
          else if (t === 'Internship') extraClass += ' exp-intern';
          else if (t === 'Master Thesis') extraClass += ' exp-thesis';
          else if (t === 'AI / ML') extraClass += ' cat-ai';
          else if (t === 'Data Engineering') extraClass += ' cat-dataeng';
          else if (t === 'Cloud / DevOps') extraClass += ' cat-devops';
          else if (t === 'Analytics / BI') extraClass += ' cat-analytics';
          else if (t === 'Forward Deployed') extraClass += ' cat-fd';
          
          return `<span class="tag ${extraClass}" onclick="filterByTag('${esc(t)}', event)">${esc(t)}</span>`;
        })
        .join('');

      // Strip HTML from description and show snippet for arbeitnow + direct
      const rawDesc = j.description || '';
      const plainDesc = rawDesc.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      const showDesc = (j.source === 'arbeitnow' || j.source === 'direct') && plainDesc.length > 10;
      const descSnippet = showDesc
        ? `<div class="job-desc">${esc(plainDesc.slice(0, 180))}${plainDesc.length > 180 ? '…' : ''}</div>`
        : '';

      // Match Score details rendering
      let matchBadgeHtml = "";
      let analysisHtml = "";
      if (hasResumeMatched && j.matchDetails) {
        const score = j.matchDetails.score;
        let scoreClass = "low";
        if (score >= 75) scoreClass = "high";
        else if (score >= 40) scoreClass = "med";
        
        matchBadgeHtml = `
          <div class="match-badge ${scoreClass}">
            <span class="match-badge-pct">${score}%</span>
            <span class="match-badge-lbl">Fit Match</span>
          </div>
        `;
        
        const isExpanded = activeAnalysisIds.has(j.job_id);
        const toggleText = isExpanded ? "Hide Fit Analysis ▲" : "View Fit Analysis ▼";
        
        let matchTagsHtml = j.matchDetails.matchedSkills.map(s => `<span class="analysis-tag match">${s}</span>`).join("");
        if (matchTagsHtml === "") matchTagsHtml = `<span style="color:#64748b;font-size:0.7rem">None</span>`;
        
        let gapTagsHtml = j.matchDetails.missingSkills.map(s => `<span class="analysis-tag gap">${s}</span>`).join("");
        if (gapTagsHtml === "") gapTagsHtml = `<span style="color:#64748b;font-size:0.7rem">None (100% skill match!)</span>`;
        
        let adviceText = "";
        if (score >= 80) {
          adviceText = "This role is an excellent fit! You match almost all requirements. Emphasize your overlapping skills in your application.";
        } else if (score >= 50) {
          if (j.matchDetails.missingSkills.length > 0) {
            const missingStr = j.matchDetails.missingSkills.slice(0, 3).join(" and ");
            adviceText = `Good fit with some skill gaps. Focus on gaining experience with <strong>${missingStr}</strong> to strengthen your profile.`;
          } else {
            adviceText = "Skills match well, but check if the seniority level or job domain aligns with your expectations.";
          }
        } else {
          if (j.matchDetails.missingSkills.length > 0) {
            const missingStr = j.matchDetails.missingSkills.slice(0, 4).join(", ");
            adviceText = `Low match. This role expects skills in <strong>${missingStr}</strong>. Consider bridging these gaps before applying.`;
          } else {
            adviceText = "Low match. This job listing does not specify detailed technical skills. Check if your background matches the title and responsibilities.";
          }
        }
        
        analysisHtml = `
          <button class="fit-analysis-toggle" onclick="toggleAnalysis('${j.job_id}', event)">
            ${toggleText}
          </button>
          <div class="fit-analysis-panel" id="analysis-${j.job_id}" style="display: ${isExpanded ? 'block' : 'none'}">
            <div class="analysis-section">
              <div class="analysis-section-title">Matching Skills</div>
              <div class="analysis-tags">${matchTagsHtml}</div>
            </div>
            <div class="analysis-section">
              <div class="analysis-section-title">Missing Skills (Gaps)</div>
              <div class="analysis-tags">${gapTagsHtml}</div>
            </div>
            <div class="analysis-section" style="margin-top:0.6rem">
              <div class="analysis-section-title">⚡ Career Roadmap Advice</div>
              <div class="analysis-text">${adviceText}</div>
            </div>
          </div>
        `;
      }

      return `
        <div class="job-card" id="job-card-${j.job_id}">
          <div class="job-info">
            <div class="job-title" title="${esc(j.title)}">${esc(j.title)}</div>
            <div class="job-company">${esc(j.company || '\u2014')}</div>
            <div class="job-meta">
              <span>📍 ${esc((j.location || '\u2014').split(',')[0].trim())}</span>
              <span class="tag ${sourceClass}">${sourceLabel}</span>
              ${directBadge}
              ${workStyleBadge}
              ${langReqBadge}
              ${typeTags}
              ${tagChips}
              <span>${j.date_added || ''}</span>
            </div>
            ${descSnippet}
            ${analysisHtml}
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-end; gap:0.75rem; justify-content:center;">
            ${matchBadgeHtml}
            <a class="apply-btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">
              Apply →
            </a>
          </div>
        </div>`;
    }).join("");

    renderPagination();
  }

  function renderPagination() {
    const total = Math.ceil(filtered.length / PAGE_SIZE);
    if (total <= 1) { document.getElementById("pagination").innerHTML = ""; return; }
    const lo = Math.max(1, page - 2), hi = Math.min(total, page + 2);
    const btns = [];
    if (page > 1) btns.push(`<button class="page-btn" onclick="goPage(${page-1})">‹</button>`);
    for (let i = lo; i <= hi; i++)
      btns.push(`<button class="page-btn ${i===page?"active":""}" onclick="goPage(${i})">${i}</button>`);
    if (page < total) btns.push(`<button class="page-btn" onclick="goPage(${page+1})">›</button>`);
    document.getElementById("pagination").innerHTML = btns.join("");
  }

  function goPage(p) { page = p; renderJobs(); window.scrollTo(0, 0); }

  function esc(s) {
    return String(s || "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  ["search","location"].forEach(id => {
    document.getElementById(id).addEventListener("input", applyFilters);
  });
  ["source","work_style","job_type","language"].forEach(id => {
    document.getElementById(id).addEventListener("change", loadJobs);
  });
  ["sort_order", "experience_level"].forEach(id => {
    document.getElementById(id).addEventListener("change", applyFilters);
  });

  loadJobs();
</script>
</body>
</html>
