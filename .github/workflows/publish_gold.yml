name: Publish Gold Data

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * *'     # ~30 min after evening ingest (20:30 UTC)
  repository_dispatch:
    types: [gold_data_updated]
  workflow_dispatch:


jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # OIDC token for AWS role assumption
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::942361733704:role/dataforge-github-actions-dev
          aws-region: eu-central-1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install awswrangler pandas

      - name: Download Gold from S3
        run: python scripts/download_all.py

      - name: Regenerate dashboard PNG
        run: pip install matplotlib && python scripts/visualize_gold.py

      # Adding the directory (not *.csv) skips gitignored files: the large
      # all_jobs.csv / expired_jobs.csv are excluded so git history does not
      # grow by ~6 MB per day — S3 (and Silver history) is the system of record.
      - name: Commit and push data
        run: |
          git config user.name "dataforge-bot"
          git config user.email "actions@github.com"
          git add data/gold/
          git diff --staged --quiet || git commit -m "chore: refresh gold data $(date -u +%Y-%m-%d)"
          git push origin main
