name: Publish Gold Data

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * *'     # ~30 min after evening ingest (20:30 UTC)
  repository_dispatch:
    types: [gold_data_updated]
  workflow_dispatch:


jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # OIDC token for AWS role assumption
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::366945363779:role/dataforge-github-actions-dev
          aws-region: eu-central-1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install awswrangler pandas

      - name: Download Gold from S3
        env:
          GOLD_BUCKET: dataforge-gold-dev-366945363779
        run: python scripts/download_all.py

      - name: Regenerate dashboard PNG
        run: pip install matplotlib && python scripts/visualize_gold.py

      - name: Generate SEO JobPosting pages
        run: python scripts/generate_seo_job_pages.py --limit 800

      - name: Mirror metrics.json for Pages first paint
        run: cp data/gold/metrics.json docs/metrics.json

      # Adding the directory (not *.csv) skips gitignored files: the large
      # all_jobs.csv / expired_jobs.csv are excluded so git history does not
      # grow by ~6 MB per day — S3 (and Silver history) is the system of record.
      - name: Commit and push data
        run: |
          git config user.name "dataforge-bot"
          git config user.email "actions@github.com"
          git add data/gold/ docs/metrics.json docs/jobs/ docs/sitemap.xml docs/robots.txt
          git diff --staged --quiet || git commit -m "chore: refresh gold data $(date -u +%Y-%m-%d)"
          git push origin main

  # GITHUB_TOKEN pushes do not trigger other workflows, so Pages never
  # redeployed after gold refresh. Deploy in the same run permanently.
  deploy-pages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - id: deploy
        uses: actions/deploy-pages@v4
