name: Publish Gold Data

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 8 * * *'   # 30 min after pipeline runs at 8AM UTC
  workflow_dispatch:


jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install awswrangler pandas

      - name: Download Gold from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
        run: python analytics/download_all.py

      - name: Regenerate dashboard PNG
        run: pip install matplotlib && python analytics/visualize_gold.py

      - name: Commit and push data
        run: |
          git config user.name "dataforge-bot"
          git config user.email "actions@github.com"
          git add analytics/*.csv analytics/job_market_dashboard.png
          git diff --staged --quiet || git commit -m "chore: refresh gold data $(date -u +%Y-%m-%d)"
          git push origin main
