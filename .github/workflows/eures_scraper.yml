name: EURES Ingestion Scraper

on:
  schedule:
    - cron: '0 4 * * *'  # Runs daily at 4:00 AM UTC
  workflow_dispatch:     # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-test.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run EURES Ingestion Script
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
          BRONZE_BUCKET: dataforge-bronze-dev-eu-central-1
          LOCAL_RUN: "false"
        run: python -c "import sys; sys.path.append('src'); import ingest_eures; print(ingest_eures.lambda_handler({}, None))"
