name: EURES Ingestion Scraper

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC — morning snapshot for the same-day partition
    # 19:15 UTC (not 20:00): GitHub cron starts are often 5-15+ min late, and the
    # 20:30 transformer only reads today's partition once — this guarantees the
    # evening EURES pull lands before the transformer runs.
    - cron: '15 19 * * *'
  workflow_dispatch:     # Allows manual trigger from GitHub UI

permissions:
  id-token: write   # OIDC token for AWS role assumption
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::942361733704:role/dataforge-github-actions-dev
          aws-region: eu-central-1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-test.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run EURES Ingestion Script
        id: ingest
        env:
          BRONZE_BUCKET: dataforge-bronze-dev-eu-central-1
          LOCAL_RUN: "false"
        run: |
          python -c "
          import sys
          sys.path.append('src')
          import ingest_eures
          result = ingest_eures.lambda_handler({}, None)
          print(result)
          if result.get('statusCode') != 200:
            raise SystemExit(f\"EURES ingest failed: {result}\")
          "
