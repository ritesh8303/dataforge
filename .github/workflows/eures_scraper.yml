name: EURES Ingestion Scraper

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC — morning pipeline
    - cron: '0 20 * * *'  # 20:00 UTC ≈ 22:00 Europe/Berlin (CEST); 21:00 CET in winter
  workflow_dispatch:     # Allows manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-test.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run EURES Ingestion Script
        id: ingest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
          BRONZE_BUCKET: dataforge-bronze-dev-eu-central-1
          LOCAL_RUN: "false"
        run: |
          python -c "
          import sys
          sys.path.append('src')
          import ingest_eures
          result = ingest_eures.lambda_handler({}, None)
          print(result)
          if result.get('statusCode') != 200:
            raise SystemExit(f\"EURES ingest failed: {result}\")
          "

      - name: Trigger Silver transformer
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
        run: |
          python -c "
          import boto3, json
          from datetime import datetime, timezone
          date = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          client = boto3.client('lambda', region_name='eu-central-1')
          client.invoke(
              FunctionName='dataforge-transformer',
              InvocationType='Event',
              Payload=json.dumps({'date': date}),
          )
          print(f'Triggered dataforge-transformer for ingested_at={date}')
          "
